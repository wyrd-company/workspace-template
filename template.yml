name: workspace
description: A devcontainer workspace with agent, workflow, and memory folders

data:
  default_org: wyrd-company
  default_domain: wyrd.internal
  default_nats_url: nats://nats.wyrd.internal:4222
  default_open_observe_url: openobserve.internal:5081
  workspace_name_must_be_lowercase_letters_digits_underscore_or_hyphen: at most 63 characters, starting with a letter or digit

interview:
  - id: org
    type: text
    prompt: Workspaces GitHub account
    description: The GitHub account holding the workspace repositories
    default: "{{ default_org }}"
    required: true

  - id: workspace
    computed: "toha_target_name"

  # Computed, so that no answer or configured default replaces it. A name that cannot name a
  # Xolotl key or a Wyrwood policy value stops the interview here, before a file is written. Toha
  # has no way to raise an error, so converting the rule's text to a number is the failure, and
  # the error quotes this expression.
  - id: xolotl_key_name
    computed: >-
      workspace
      if (workspace | length <= 63
          and workspace[0] in 'abcdefghijklmnopqrstuvwxyz0123456789'
          and workspace | list | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789_-') | list | length == 0)
      else workspace_name_must_be_lowercase_letters_digits_underscore_or_hyphen | int

  - id: name
    type: text
    prompt: Workspace name
    default: "{{ workspace | title }}"
    required: true

  - id: remote
    type: git
    prompt: Workspace remote URL (empty for none)

  - id: domain_name
    type: text
    prompt: Host domain name
    description: The hostname to use for the workspace
    default: "{{ workspace }}.{{ default_domain }}"
    required: true

  - id: xolotl_url
    type: text
    prompt: Xolotl gateway URL
    description: Claude Code and Codex reach their models through this gateway.
    default: https://xolotl.internal
    required: true

  - id: xolotl_key_policy
    type: text
    prompt: Xolotl key policy
    description: The Xolotl key policy only this host's workspaces use. A host sets its default in Toha's template-defaults.
    required: true
    validate:
      regex: '^[a-z0-9][a-z0-9_-]{0,62}$'

  - id: xolotl_key
    computed: "xolotl_key_policy ~ '/' ~ xolotl_key_name"

  - id: sdks
    type: multiselect
    prompt: SDKs
    description: Which SDKs to install. Node will always be added.
    options: [ bun, dart, dotnet, flutter, go, node, python, rust ]
    default: [ node ]

  - id: docker
    type: select
    prompt: Docker support
    description: Installs a devcontainer feature for Docker
    options: [ none, docker-in-docker, docker-outside-of-docker ]
    default: none

  - id: uses_docker
    computed: "docker != 'none'"

  - id: enable_gpu
    type: confirm
    prompt: Do you need GPU support?
    default: false

  - id: nats_url
    type: text
    prompt: NATS URL
    description: Url to the NATS.io server
    default: "{{ default_nats_url }}"
    required: true

  - id: otlp_endpoint
    type: text
    prompt: OpenTelemetry reciever URL
    description: The URL to the OpenTelemetry reciever (OpenObserve)
    default: "{{ default_open_observe_url }}"
    required: true

  - id: ansible_repo
    computed: "'https://github.com/' ~ org ~ '/workspace-ansible.git'"

  - id: dotfiles_repo
    computed: "'https://github.com/' ~ org ~ '/workspace-dotfiles.git'"

# Bind-mount sources with no template files; /tasks must stay empty for `git worktree add`
directories:
  - path: repos
  - path: tasks
  - path: workflows
  - path: docker
    when: "docker == 'docker-outside-of-docker'"

messages:
  before-apply: |
    Creating workspace {{ name }} ({{ workspace }})...
  after-apply: |
    Workspace {{ name }} is ready.
